<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquímetro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Simulador de Parquímetro</h1>
        <div class="input-area">
            <label for="valor">Informe o valor (R$):</label>
            <input type="number" id="valor" placeholder="Digite o valor" step="0.01">
        </div>
        <button onclick="calcularTempo()">Calcular</button>
        <div id="resultado">
            <p id="tempo"></p>
            <p id="troco"></p>
            <p id="erro"></p>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
